aid: huntress
name: Huntress
description: >-
  Huntress is a managed cybersecurity platform built for small and mid-sized
  businesses and the MSPs/MSSPs that serve them, pairing purpose-built software
  with a human-powered 24/7 Security Operations Center (SOC). Its products span
  Managed EDR (including macOS and Managed Microsoft Defender), Managed ITDR for
  Microsoft 365 identities, Managed SIEM, and Managed Security Awareness
  Training. The Huntress REST API (api.huntress.io/v1) gives partners
  programmatic access to accounts, organizations, agents, incident reports,
  remediations, escalations, platform actions, signals, external recon, billing
  and reseller subscriptions, plus a SIEM ES|QL query endpoint — secured with
  HTTP Basic API keys, cursor-paginated, with real-time webhooks and an official
  remote MCP server for AI agents.
